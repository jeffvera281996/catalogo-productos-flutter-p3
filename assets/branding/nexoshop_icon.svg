<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- NexoShop - icono principal (fondo completo, sin transparencia: valido para iOS) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4CFF"/>
      <stop offset="1" stop-color="#2A1B6E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g id="logo">
    <!-- asa de la bolsa -->
    <path d="M402 420 V360 a110 110 0 0 1 220 0 V420" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <!-- cuerpo de la bolsa -->
    <rect x="272" y="400" width="480" height="420" rx="64" fill="#FFFFFF"/>
    <!-- N formada por nodos conectados -->
    <polyline points="412,730 412,500 612,730 612,500" fill="none" stroke="#4A2FBD" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="412" cy="730" r="30" fill="#4A2FBD"/>
    <circle cx="612" cy="500" r="40" fill="#FF6B4A"/>
  </g>
</svg>
